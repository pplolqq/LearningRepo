<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地服务网关</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='12' fill='%236ea8fe'/></svg>">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="glow"></div>

  <main class="shell">
    <header class="head">
      <div class="head-text">
        <h1 id="title">本地服务网关</h1>
        <p id="subtitle">一键跳转到本机已启动的前端服务</p>
      </div>
      <div class="head-stats">
        <span class="pill" id="online-count">在线 –</span>
        <button class="ghost" id="refresh" type="button" title="重新检测 (R)">刷新状态</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="search" placeholder="搜索服务名、端口或标签…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </div>
    </div>

    <section class="grid" id="grid" aria-label="服务列表"></section>

    <p class="empty" id="empty" hidden>没有匹配的服务</p>

    <footer class="foot">
      <span id="checked-at">正在检测…</span>
      <span class="sep">·</span>
      <span>快捷键：<kbd>/</kbd> 搜索，<kbd>1</kbd>–<kbd>9</kbd> 直接打开，<kbd>R</kbd> 刷新，<kbd>Esc</kbd> 清空</span>
    </footer>
  </main>

  <template id="card-tpl">
    <a class="card" target="_blank" rel="noopener noreferrer">
      <span class="stripe"></span>
      <div class="card-head">
        <span class="dot" data-state="checking"></span>
        <span class="name"></span>
        <span class="state">检测中…</span>
      </div>
      <p class="desc"></p>
      <div class="tags"></div>
      <div class="card-foot">
        <code class="url"></code>
        <button class="copy" type="button" title="复制地址">复制</button>
      </div>
      <span class="idx"></span>
    </a>
  </template>

  <script src="/app.js"></script>
</body>
</html>
