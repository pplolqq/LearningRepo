<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>seekFile · 文件搜索</title>
<style>
  :root {
    --bg: #16181d;
    --bg-soft: #1d2027;
    --bg-raised: #23262e;
    --border: #31353f;
    --border-soft: #272b33;
    --text: #e4e6eb;
    --text-dim: #9aa0ab;
    --text-faint: #6b7280;
    --accent: #4f8cff;
    --accent-soft: rgba(79, 140, 255, 0.16);
    --mark: rgba(255, 196, 0, 0.28);
    --danger: #ff6b6b;
    --ok: #3ecf8e;
    --mono: ui-monospace, "Cascadia Code", "JetBrains Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.5 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, input, select { font: inherit; color: inherit; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 16px; border-bottom: 1px solid var(--border-soft);
    background: var(--bg-soft); flex: none;
  }
  .brand { font-weight: 600; letter-spacing: .3px; }
  .brand span { color: var(--accent); }
  .status { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--danger); }
  .spacer { flex: 1; }
  .hint { font-size: 12px; color: var(--text-faint); }
  kbd {
    font: 11px var(--mono); background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: 4px; padding: 1px 5px; color: var(--text-dim);
  }

  /* ---------- search area ---------- */
  .searchbar { padding: 14px 16px 0; flex: none; }
  .inputwrap { position: relative; }
  #q {
    width: 100%; padding: 11px 76px 11px 14px; font-size: 15px;
    background: var(--bg-raised); border: 1px solid var(--border);
    border-radius: 8px; outline: none; transition: border-color .12s;
  }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #q::placeholder { color: var(--text-faint); }
  .inputtools { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; }
  .chip {
    border: 1px solid var(--border); background: transparent; color: var(--text-dim);
    border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 12px; transition: .12s;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: #a8c7ff; }
  .chip[disabled] { opacity: .35; cursor: not-allowed; }

  /* ---------- category + options ---------- */
  .cats { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 0; flex: none; }
  .opts {
    display: flex; flex-wrap: wrap; align-items: center; gap: 14px;
    padding: 12px 16px; border-bottom: 1px solid var(--border-soft); flex: none;
  }
  .opt { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
  .opt select {
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: 6px;
    padding: 4px 6px; outline: none; max-width: 190px;
  }
  .opt input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  .opt label { cursor: pointer; user-select: none; }

  /* ---------- results ---------- */
  .results { flex: 1; overflow-y: auto; overflow-x: hidden; }
  .head, .row {
    display: grid;
    grid-template-columns: 22px minmax(150px, 1.5fr) minmax(160px, 2.4fr) 90px 130px;
    gap: 10px; align-items: center; padding: 0 16px;
  }
  .head {
    position: sticky; top: 0; z-index: 2; height: 30px; font-size: 11px;
    color: var(--text-faint); background: var(--bg);
    border-bottom: 1px solid var(--border-soft);
    text-transform: uppercase; letter-spacing: .5px;
  }
  .head .s { cursor: pointer; }
  .head .s:hover { color: var(--text); }
  .head .s.active { color: var(--accent); }
  .row {
    height: 30px; cursor: default; border-bottom: 1px solid transparent;
    font-size: 13px; white-space: nowrap;
    user-select: none;   /* dragging the pointer across rows must not select text */
  }
  .row:hover { background: var(--bg-soft); }
  .row.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .row .ico { text-align: center; font-size: 13px; opacity: .85; }
  .row .nm { overflow: hidden; text-overflow: ellipsis; }
  .row .dir {
    overflow: hidden; text-overflow: ellipsis; color: var(--text-dim);
    font: 12px var(--mono); direction: rtl; text-align: left;
  }
  .row .dir bdi { unicode-bidi: plaintext; }
  .row .sz, .row .dt { color: var(--text-faint); font: 12px var(--mono); text-align: right; }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }
  .empty { padding: 60px 16px; text-align: center; color: var(--text-faint); }
  .empty b { color: var(--text-dim); font-weight: 500; }
  .more { padding: 14px 16px 30px; text-align: center; }

  /* ---------- footer ---------- */
  footer {
    flex: none; display: flex; align-items: center; gap: 12px;
    padding: 7px 16px; border-top: 1px solid var(--border-soft);
    background: var(--bg-soft); font-size: 12px; color: var(--text-dim);
  }
  footer .query {
    font: 11px var(--mono); color: var(--text-faint); background: var(--bg);
    border: 1px solid var(--border-soft); border-radius: 4px; padding: 2px 7px;
    max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  footer .err { color: var(--danger); }
  .toast {
    position: fixed; bottom: 46px; left: 50%; transform: translateX(-50%);
    background: var(--bg-raised); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 16px; font-size: 12px; opacity: 0; pointer-events: none;
    transition: opacity .18s; z-index: 50; box-shadow: 0 8px 24px rgba(0,0,0,.45);
  }
  .toast.show { opacity: 1; }

  /* Narrow windows: drop the least useful columns instead of clipping them. */
  @media (max-width: 900px) {
    header .hint { display: none; }
  }
  @media (max-width: 700px) {
    .head, .row {
      grid-template-columns: 22px minmax(120px, 1fr) 120px;
      gap: 8px; padding: 0 12px;
    }
    .head > :nth-child(3), .row > :nth-child(3),
    .head > :nth-child(4), .row > :nth-child(4) { display: none; }
  }
  @media (max-width: 460px) {
    .head, .row { grid-template-columns: 22px minmax(120px, 1fr); }
    .head > :nth-child(5), .row > :nth-child(5) { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">seek<span>File</span></div>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">连接中…</span></div>
  <div class="spacer"></div>
  <div class="hint">
    移动鼠标或 <kbd>↑</kbd><kbd>↓</kbd> 选择 ·
    <kbd>Enter</kbd> 或双击 定位 ·
    <kbd>Alt</kbd>+<kbd>Enter</kbd> 打开 ·
    <kbd>Ctrl</kbd>+<kbd>C</kbd> 复制路径
  </div>
</header>

<div class="searchbar">
  <div class="inputwrap">
    <input id="q" type="text" autocomplete="off" spellcheck="false"
           placeholder="输入文件名或路径片段…（支持 Everything 语法，如 ext:md、path:C:\Work、size:>100mb）">
    <div class="inputtools">
      <button class="chip" id="btnRegex" title="按正则表达式匹配">正则</button>
      <button class="chip" id="btnCase" title="区分大小写">Aa</button>
      <button class="chip" id="btnClear" title="清空">✕</button>
    </div>
  </div>
</div>

<div class="cats" id="cats"></div>

<div class="opts">
  <div class="opt">
    <input type="checkbox" id="cbPath">
    <label for="cbPath" title="让正则匹配完整路径，而不仅是文件名">正则匹配路径</label>
  </div>
  <div class="opt">
    <span>范围</span>
    <select id="selScope"><option value="">全部位置</option></select>
  </div>
  <div class="opt">
    <span>排序</span>
    <select id="selSort">
      <option value="date_modified">修改时间</option>
      <option value="name">名称</option>
      <option value="path">路径</option>
      <option value="size">大小</option>
      <option value="extension">类型</option>
      <option value="date_created">创建时间</option>
    </select>
    <button class="chip" id="btnDir" title="切换升序/降序">↓</button>
  </div>
  <div class="opt">
    <span>显示</span>
    <select id="selLimit">
      <option value="100">100 条</option>
      <option value="200" selected>200 条</option>
      <option value="500">500 条</option>
      <option value="1000">1000 条</option>
    </select>
  </div>
</div>

<div class="results" id="results">
  <div class="empty" id="empty">
    <b>开始搜索</b><br>输入关键词，或直接点上面的分类浏览。
  </div>
  <div class="head" id="head" style="display:none">
    <div></div>
    <div class="s" data-sort="name">名称</div>
    <div class="s" data-sort="path">路径</div>
    <div class="s" data-sort="size">大小</div>
    <div class="s" data-sort="date_modified">修改时间</div>
  </div>
  <div id="rows"></div>
  <div class="more" id="more" style="display:none"></div>
</div>

<footer>
  <span id="stat">就绪</span>
  <span class="query" id="queryDump" style="display:none"></span>
  <div class="spacer"></div>
  <span class="err" id="err"></span>
</footer>

<div class="toast" id="toast"></div>

<script>
"use strict";

const CATEGORIES = [
  ["all","全部"],["folder","文件夹"],["image","图片"],["doc","文档"],
  ["video","视频"],["audio","音频"],["archive","压缩包"],["code","代码"],["exe","程序"]
];

const RISKY = new Set(["exe","msi","msix","appx","bat","cmd","com","scr",
                       "ps1","psm1","vbs","vbe","js","jse","wsf","wsh","reg","lnk"]);

const ICONS = {
  folder:"📁", image:"🖼", video:"🎬", audio:"🎵", archive:"🗜",
  doc:"📄", code:"⌨", exe:"⚙"
};
const EXT_GROUP = {
  jpg:"image",jpeg:"image",png:"image",gif:"image",bmp:"image",webp:"image",svg:"image",
  ico:"image",tif:"image",tiff:"image",heic:"image",avif:"image",psd:"image",
  mp4:"video",mkv:"video",avi:"video",mov:"video",wmv:"video",flv:"video",webm:"video",m4v:"video",
  mp3:"audio",flac:"audio",wav:"audio",aac:"audio",m4a:"audio",ogg:"audio",wma:"audio",
  zip:"archive",rar:"archive","7z":"archive",tar:"archive",gz:"archive",xz:"archive",iso:"archive",jar:"archive",
  java:"code",js:"code",ts:"code",py:"code",go:"code",c:"code",cpp:"code",h:"code",
  cs:"code",php:"code",rb:"code",rs:"code",sql:"code",sh:"code",ps1:"code",
  xml:"code",json:"code",yml:"code",yaml:"code",html:"code",css:"code",vue:"code",
  doc:"doc",docx:"doc",pdf:"doc",txt:"doc",md:"doc",rtf:"doc",
  xls:"doc",xlsx:"doc",csv:"doc",ppt:"doc",pptx:"doc",
  exe:"exe",msi:"exe",bat:"exe",cmd:"exe",dll:"exe",sys:"exe",lnk:"exe"
};

const $ = (id) => document.getElementById(id);
const state = {
  q:"", category:"all", scope:"", regex:false, matchPath:false, caseSensitive:false,
  sort:"date_modified", desc:true, limit:200,
  rows:[], total:0, sel:-1, offset:0, loading:false, queryDump:"",
  health:{ text:"连接中…", cls:"" }
};

/* ---------------- persistence ---------------- */
const SAVE_KEYS = ["category","scope","regex","matchPath","caseSensitive","sort","desc","limit"];
function saveState(){
  const out = {};
  for (const k of SAVE_KEYS) out[k] = state[k];
  try { localStorage.setItem("seekfile", JSON.stringify(out)); } catch (_) {}
}
function loadState(){
  try {
    const raw = localStorage.getItem("seekfile");
    if (raw) Object.assign(state, JSON.parse(raw));
  } catch (_) {}
}

/* ---------------- helpers ---------------- */
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatSize(bytes){
  if (bytes === null || bytes === undefined) return "—";
  if (bytes < 1024) return bytes + " B";
  const units = ["KB","MB","GB","TB"];
  let v = bytes / 1024, i = 0;
  while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
  return (v < 10 ? v.toFixed(1) : Math.round(v)) + " " + units[i];
}
function formatTime(iso){
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d)) return "—";
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff/60) + " 分钟前";
  if (diff < 86400) return Math.floor(diff/3600) + " 小时前";
  if (diff < 86400*30) return Math.floor(diff/86400) + " 天前";
  try { return d.toLocaleDateString("zh-CN"); } catch (_) { return iso.slice(0,10); }
}
function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1600);
}

/* Matchers return [start,end] spans so we can highlight without breaking escaping. */
function textMatcher(term){
  const needles = term.split(/\s+/).filter(t => t && !/^[a-z]+:/i.test(t));
  if (!needles.length) return null;
  const lower = needles.map(n => n.toLowerCase());
  return (text) => {
    const hay = text.toLowerCase(), spans = [];
    for (const n of lower) {
      let i = 0;
      while ((i = hay.indexOf(n, i)) !== -1) { spans.push([i, i + n.length]); i += n.length; }
    }
    return spans.sort((a,b) => a[0] - b[0]);
  };
}
function regexMatcher(pattern, caseSensitive){
  let re;
  try { re = new RegExp(pattern, caseSensitive ? "g" : "gi"); }
  catch (_) { return null; }
  return (text) => {
    re.lastIndex = 0;
    const spans = [];
    let m, guard = 0;
    while ((m = re.exec(text)) !== null && guard++ < 500) {
      if (m[0].length === 0) { re.lastIndex++; continue; }
      spans.push([m.index, m.index + m[0].length]);
      if (m.index === re.lastIndex) re.lastIndex++;
    }
    return spans;
  };
}
function highlight(text, matcher){
  if (!matcher) return escapeHtml(text);
  let spans;
  try { spans = matcher(text) || []; } catch (_) { return escapeHtml(text); }
  if (!spans.length) return escapeHtml(text);
  let out = "", last = 0;
  for (const [s,e] of spans){
    if (s < last) continue;
    out += escapeHtml(text.slice(last, s)) + "<mark>" + escapeHtml(text.slice(s, e)) + "</mark>";
    last = e;
  }
  return out + escapeHtml(text.slice(last));
}
function iconFor(row){
  if (row.is_folder) return ICONS.folder;
  return ICONS[EXT_GROUP[row.ext]] || ICONS.doc;
}

/* When a scope is active its prefix repeats on every row - show the tail only. */
function displayDir(row){
  const scope = state.scope;
  if (scope && row.dir.toLowerCase().startsWith(scope.toLowerCase())){
    const rest = row.dir.slice(scope.length).replace(/^[\\/]+/, "");
    if (rest) return "…\\" + rest;
  }
  return row.dir;
}

/* ---------------- api ---------------- */
let inflight = null;

async function search({ append = false } = {}){
  if (!shouldSearch()){ renderEmpty(); return; }
  if (inflight) inflight.abort();
  const ctrl = new AbortController();
  inflight = ctrl;
  state.loading = true;
  setStatus("搜索中…");

  const offset = append ? state.rows.length : 0;
  const p = new URLSearchParams({
    q: state.q, category: state.category, scope: state.scope,
    regex: state.regex ? "1" : "0",
    match_path: state.matchPath ? "1" : "0",
    case: state.caseSensitive ? "1" : "0",
    sort: state.sort, desc: state.desc ? "1" : "0",
    limit: String(state.limit), offset: String(offset)
  });

  try {
    const res = await fetch("/api/search?" + p, { signal: ctrl.signal });
    const data = await res.json();
    if (ctrl !== inflight) return;
    if (data.error){
      $("err").textContent = data.error;
      state.rows = []; state.total = 0;
      renderRows(); setStatus("出错"); updateFooter(); return;
    }
    $("err").textContent = "";
    state.rows = append ? state.rows.concat(data.results) : data.results;
    state.total = data.total;
    state.queryDump = data.everything_query || "";
    if (!append) state.sel = state.rows.length ? 0 : -1;
    renderRows();
    updateFooter(data.elapsed_ms);
  } catch (e){
    if (e.name === "AbortError") return;
    $("err").textContent = "请求失败：" + e.message;
    setStatus("后端未响应");
  } finally {
    if (ctrl === inflight){
      state.loading = false; inflight = null;
      applyHealthStatus();   // the header shows connection state, not search state
    }
  }
}

async function act(kind, row){
  if (!row) return;
  const path = row.full_path;
  if (kind === "open" && !row.is_folder && RISKY.has(row.ext)){
    if (!confirm("确定要运行这个文件吗？\n\n" + path)) return;
  }
  try {
    const res = await fetch("/api/" + kind, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ path })
    });
    const data = await res.json();
    if (!data.ok) return toast(data.error || "操作失败");
    if (kind === "open") toast("已用默认程序打开");
    else toast("已在资源管理器中定位");
  } catch (e){ toast("操作失败：" + e.message); }
}
async function copyPath(row){
  if (!row) return;
  try { await navigator.clipboard.writeText(row.full_path); toast("已复制路径"); }
  catch (_) { toast("复制失败，请手动选择"); }
}

/* Guard against a triple click, or a repeated double click on the same row,
   spawning a second Explorer window for a path we just opened. */
let lastReveal = { path:"", at:0 };
async function revealRow(row){
  if (!row) return;
  const now = Date.now();
  if (row.full_path === lastReveal.path && now - lastReveal.at < 700) return;
  lastReveal = { path: row.full_path, at: now };
  await act("reveal", row);
}

/* ---------------- rendering ---------------- */
function shouldSearch(){
  return state.q.trim().length > 0 || state.category !== "all" || state.scope !== "";
}
function currentMatcher(){
  if (!state.q.trim()) return null;
  return state.regex
    ? regexMatcher(state.q.trim(), state.caseSensitive)
    : textMatcher(state.q.trim());
}
function renderEmpty(){
  state.rows = []; state.total = 0; state.sel = -1; state.queryDump = "";
  $("rows").innerHTML = "";
  $("head").style.display = "none";
  $("more").style.display = "none";
  const empty = $("empty");
  empty.style.display = "";
  empty.innerHTML = "<b>开始搜索</b><br>输入关键词，或直接点上面的分类浏览。";
  setStatus("就绪"); updateFooter(); $("err").textContent = "";
}
function renderRows(){
  const rowsEl = $("rows");
  const matcher = currentMatcher();
  $("empty").style.display = state.rows.length ? "none" : "";
  $("head").style.display = state.rows.length ? "" : "none";
  if (!state.rows.length){
    rowsEl.innerHTML = "";
    $("empty").innerHTML = "<b>没有匹配的文件</b><br>试试放宽条件，或换一个范围。";
    $("more").style.display = "none";
    return;
  }
  const parts = state.rows.map((row, i) => {
    const pathHit = state.regex && state.matchPath;
    const dir = highlight(displayDir(row), pathHit || !state.regex ? matcher : null);
    const name = highlight(row.name, matcher);
    return `<div class="row${i === state.sel ? " sel" : ""}" data-i="${i}" title="${escapeHtml(row.full_path)}">
      <div class="ico">${iconFor(row)}</div>
      <div class="nm">${name}</div>
      <div class="dir"><bdi>${dir}</bdi></div>
      <div class="sz">${row.is_folder ? "—" : formatSize(row.size)}</div>
      <div class="dt">${formatTime(row.mtime)}</div>
    </div>`;
  });
  rowsEl.innerHTML = parts.join("");

  const shown = state.rows.length;
  if (state.total > shown){
    $("more").style.display = "";
    $("more").innerHTML = `<button class="chip" id="btnMore">加载更多（已显示 ${shown} / ${state.total} 条）</button>`;
    $("btnMore").onclick = () => search({ append: true });
  } else {
    $("more").style.display = "none";
  }
  scrollToSel();
}
function updateFooter(elapsed){
  const n = state.total;
  const shown = state.rows.length;
  if (!shouldSearch()){ $("stat").textContent = "就绪"; }
  else if (n === 0){ $("stat").textContent = "没有匹配结果"; }
  else {
    $("stat").textContent =
      `共 ${n.toLocaleString()} 条` +
      (shown < n ? `，已显示 ${shown}` : "") +
      (elapsed !== undefined ? ` · ${elapsed} ms` : "");
  }
  const dump = $("queryDump");
  dump.style.display = state.queryDump ? "" : "none";
  dump.textContent = state.queryDump ? "Everything: " + state.queryDump : "";
  dump.title = state.queryDump;
}
function setStatus(text, cls){
  $("statusText").textContent = text;
  const dot = $("dot");
  dot.className = "dot" + (cls ? " " + cls : "");
}
function applyHealthStatus(){
  setStatus(state.health.text, state.health.cls);
}
function scrollToSel(){
  const el = $("rows").querySelector(".row.sel");
  if (el) el.scrollIntoView({ block: "nearest" });
}
/* O(1): pointer hover calls this on every row change, so it must not walk
   the whole list. */
function select(i, { scroll = true } = {}){
  if (i < 0 || i >= state.rows.length) return;
  const rows = $("rows").children;
  if (state.sel >= 0 && rows[state.sel]) rows[state.sel].classList.remove("sel");
  state.sel = i;
  if (rows[i]) rows[i].classList.add("sel");
  // Hover must never scroll: the row is already under the pointer, and
  // scrolling would slide a different row under it and loop forever.
  if (scroll) scrollToSel();
}
function selectedRow(){
  return state.sel >= 0 ? state.rows[state.sel] : null;
}

/* ---------------- wiring ---------------- */
function buildCats(){
  $("cats").innerHTML = CATEGORIES.map(([id,label]) =>
    `<button class="chip${state.category === id ? " on" : ""}" data-cat="${id}">${label}</button>`
  ).join("");
  for (const btn of $("cats").children){
    btn.onclick = () => {
      state.category = btn.dataset.cat;
      for (const b of $("cats").children) b.classList.toggle("on", b === btn);
      saveState(); search();
    };
  }
}
function syncControls(){
  $("btnRegex").classList.toggle("on", state.regex);
  $("btnCase").classList.toggle("on", state.caseSensitive);
  $("cbPath").checked = state.matchPath;
  $("cbPath").disabled = !state.regex;
  $("selScope").value = state.scope;
  $("selSort").value = state.sort;
  $("selLimit").value = String(state.limit);
  $("btnDir").textContent = state.desc ? "↓" : "↑";
  for (const h of $("head").querySelectorAll(".s"))
    h.classList.toggle("active", h.dataset.sort === state.sort);
}
async function loadScopes(){
  try {
    const res = await fetch("/api/scopes");
    const data = await res.json();
    const sel = $("selScope");
    for (const s of data.scopes || []){
      const o = document.createElement("option");
      o.value = s.path; o.textContent = s.label + "  (" + s.path + ")";
      sel.appendChild(o);
    }
    sel.value = state.scope;
  } catch (_) {}
}
async function health(){
  try {
    const res = await fetch("/api/health");
    const data = await res.json();
    if (data.ok) state.health = { text:`Everything 已连接 · ${data.latency_ms} ms`, cls:"ok" };
    else {
      state.health = { text:"Everything 未连接", cls:"bad" };
      $("err").textContent = data.error;
    }
  } catch (_) { state.health = { text:"后端未运行", cls:"bad" }; }
  if (!state.loading) applyHealthStatus();
}

function debounce(fn, ms){
  let t;
  return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
const debouncedSearch = debounce(() => search(), 180);

function init(){
  loadState();
  buildCats();
  syncControls();
  loadScopes();
  health();
  setInterval(health, 30000);

  $("q").value = state.q || "";
  $("q").addEventListener("input", () => {
    state.q = $("q").value;
    debouncedSearch();
  });
  $("q").addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      select(state.sel + (e.key === "ArrowDown" ? 1 : -1));
    } else if (e.key === "Enter"){
      e.preventDefault();
      const row = selectedRow();
      if (!row) return;
      if (e.altKey) act("open", row); else revealRow(row);
    } else if (e.key === "Escape"){
      $("q").value = ""; state.q = ""; search(); $("q").focus();
    }
  });
  $("btnRegex").onclick = () => { state.regex = !state.regex; syncControls(); saveState(); search(); };
  $("btnCase").onclick = () => { state.caseSensitive = !state.caseSensitive; syncControls(); saveState(); search(); };
  $("btnClear").onclick = () => { $("q").value = ""; state.q = ""; search(); $("q").focus(); };
  $("cbPath").onchange = () => { state.matchPath = $("cbPath").checked; saveState(); search(); };
  $("selScope").onchange = () => { state.scope = $("selScope").value; saveState(); search(); };
  $("selSort").onchange = () => { state.sort = $("selSort").value; syncControls(); saveState(); search(); };
  $("selLimit").onchange = () => { state.limit = parseInt($("selLimit").value, 10); saveState(); search(); };
  $("btnDir").onclick = () => { state.desc = !state.desc; syncControls(); saveState(); search(); };

  for (const h of $("head").querySelectorAll(".s")){
    h.onclick = () => {
      if (state.sort === h.dataset.sort) state.desc = !state.desc;
      else { state.sort = h.dataset.sort; state.desc = true; }
      syncControls(); saveState(); search();
    };
  }

  $("rows").addEventListener("click", (e) => {
    const el = e.target.closest(".row");
    if (!el) return;
    select(parseInt(el.dataset.i, 10), { scroll: false });
  });
  // A single click only selects, so opening is reserved for double click,
  // Enter and the right mouse button.
  $("rows").addEventListener("dblclick", (e) => {
    const el = e.target.closest(".row");
    if (!el) return;
    revealRow(state.rows[parseInt(el.dataset.i, 10)]);
  });
  // Selection follows the pointer, so moving the mouse up and down switches
  // the highlighted file without touching the keyboard.
  $("rows").addEventListener("mousemove", (e) => {
    const el = e.target.closest(".row");
    if (!el) return;
    const i = parseInt(el.dataset.i, 10);
    if (i !== state.sel) select(i, { scroll: false });
  });
  $("rows").addEventListener("contextmenu", (e) => {
    const el = e.target.closest(".row");
    if (!el) return;
    e.preventDefault();
    const i = parseInt(el.dataset.i, 10);
    select(i, { scroll: false });
    revealRow(state.rows[i]);
  });

  document.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "c" && document.activeElement !== $("q")){
      const row = selectedRow();
      if (row){ e.preventDefault(); copyPath(row); }
    }
    if (e.key === "/" && document.activeElement !== $("q")){
      e.preventDefault(); $("q").focus(); $("q").select();
    }
  });

  if (shouldSearch()) search();
}

init();
</script>
</body>
</html>
